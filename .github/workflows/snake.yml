name: Gerar snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg?palette=github-light&color_snake=#334155&color_dots=#EBEDF0,#CBD5E1,#94A3B8,#64748B,#334155
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#E2E8F0&color_dots=#161B22,#334155,#475569,#64748B,#94A3B8

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
